services:
  db:
    image: pgvector/pgvector:pg16
    container_name: precursorai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: precursor
      POSTGRES_PASSWORD: precursor_dev
      POSTGRES_DB: precursorai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
